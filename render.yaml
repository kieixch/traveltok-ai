services:
  - type: web
    name: traveltok-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build -w @traveltok/database && npm run build -w @traveltok/ai && npm run build -w @traveltok/api && npx prisma migrate deploy
    startCommand: npm run start:prod -w @traveltok/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: AI_MODE
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_MODELS
        value: "gemini-3.6-flash,gemini-3.5-flash,gemini-2.5-flash"
      - key: APIFY_TIKTOK_ACTOR_ID
        value: clockworks/tiktok-scraper
      - key: SCRAPING_MODE
        value: mock
      - key: CORS_ORIGINS
        sync: false
      - key: RATE_LIMIT_GLOBAL_LIMIT
        value: "300"
      - key: RATE_LIMIT_TTL_SECONDS
        value: "60"

  - type: worker
    name: traveltok-worker
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build -w @traveltok/database && npm run build -w @traveltok/ai && npm run build -w @traveltok/api
    startCommand: node apps/api/dist/worker.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: "true"
      - key: AI_MODE
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: APIFY_TIKTOK_ACTOR_ID
        value: clockworks/tiktok-scraper
      - key: SCRAPING_MODE
        value: mock
